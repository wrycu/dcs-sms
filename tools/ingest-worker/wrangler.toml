# Template. Copy to wrangler.local.toml (git-ignored), fill in the catalog repo
# and KV id, and deploy with:  npx wrangler deploy -c wrangler.local.toml
name = "dcs-sms-ingest"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "OWNER/dcs-sms-prefabs"
BASE_BRANCH = "main"
LIMIT_PER_IP_HOUR = "10"
LIMIT_PER_KEY_HOUR = "5"
LIMIT_PER_KEY_DAY = "20"
LIMIT_GLOBAL_HOUR = "60"
# Comma-separated submitter-key fingerprints (sms:…) to refuse with 403.
BANNED_KEYS = ""

# Hourly rate-limit counters. Create with:
#   npx wrangler kv namespace create RATE_KV
# and paste the printed id below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (never committed):
#   npx wrangler secret put GITHUB_TOKEN
